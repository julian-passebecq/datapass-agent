name: ci

on:
  push:
    branches: [main, 'feat/**', 'release/**']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    # Agent targets Windows first; fixtures use Windows paths.
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm run package
      - name: VSIX hash
        shell: pwsh
        run: Get-FileHash agent-vscode-0.2.0.vsix -Algorithm SHA256 | Format-List
      - uses: actions/upload-artifact@v4
        with:
          name: agent-vscode-vsix
          path: agent-vscode-0.2.0.vsix
          if-no-files-found: error
