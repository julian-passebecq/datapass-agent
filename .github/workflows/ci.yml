name: ci

on:
  push:
    branches: [main, 'feat/**', 'release/**', 'codex/full-agent-20261009']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    # Agent targets Windows first; fixtures use Windows paths.
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm run build:provider-kit
      - run: npm run package
      - name: VSIX hash
        shell: pwsh
        run: Get-FileHash agent-vscode-*.vsix -Algorithm SHA256 | Format-List
      - uses: actions/upload-artifact@v4
        with:
          name: agent-vscode-vsix
          path: agent-vscode-*.vsix
          if-no-files-found: error
